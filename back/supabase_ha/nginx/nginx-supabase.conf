worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream supabase_api {
    least_conn;
    server supabase-kong:8000;   # Nó principal Kong
    server supabase-kong-2:8001; # Segundo nó (quando ativo)
  }

  server {
    listen 80;

    # 🔥 Rota WebSocket Realtime (precisa tratar Upgrade)
    location /realtime/ {
      proxy_pass http://supabase_api;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST, Auth, Storage, Functions
    location / {
      proxy_pass http://supabase_api;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version 1.1;
    }
  }
}
